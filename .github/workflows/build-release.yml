# EffiSuite 自动构建 + 发布
#
# 两种触发方式：
#   1. 手动触发：仓库 Actions 页面点「Run workflow」（适合随时验证构建）
#   2. 打 tag：git tag v0.2.0 && git push origin v0.2.0
#      会自动同步版本号、构建 Windows 安装包（MSI + NSIS），
#      并创建一个 GitHub Release 草稿（draft），确认后手动发布。
#
# 只构建 Windows（windows-latest）：本应用主要用于 Windows 本地使用。
# 需要 macOS / Linux 产物时，复制本 job 并改 runs-on 即可
#（macOS 用 macos-latest，Linux 用 ubuntu-latest 并需安装 webkit2gtk 等系统库）。

name: Build & Release

on:
  workflow_dispatch: # 手动触发
  push:
    tags:
      - 'v*' # 打 v 开头 tag 时自动构建发版

# 给 release 步骤写 Release 的权限
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      TAURI_DIR: modules/tauriFront/src-tauri
      FRONT_DIR: modules/tauriFront

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.FRONT_DIR }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONT_DIR }}
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # target 目录实际输出在 src-tauri/target（tauri 从该目录构建）
          workspaces: ${{ env.TAURI_DIR }}

      - name: Install tauri-cli
        run: npm install -g @tauri-apps/cli

      # 打 tag 时把 tauri.conf.json 的 version 同步成 tag 版本（去 v 前缀），
      # 这样安装包版本号与 Release 一致。手动触发时跳过（沿用当前配置的版本）。
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $conf = Join-Path $PWD "${{ env.TAURI_DIR }}/tauri.conf.json"
          $ver  = $env:GITHUB_REF_NAME -replace '^v', ''
          Write-Host "Syncing version to $ver"
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          $json.version = $ver
          $out  = $json | ConvertTo-Json -Depth 100
          # 写 UTF-8 无 BOM（serde_json 不认 BOM）
          [System.IO.File]::WriteAllText($conf, $out, (New-Object System.Text.UTF8Encoding $false))

      # beforeBuildCommand（npm run build）会随 tauri build 自动执行，
      # npm 会自动向上定位到 modules/tauriFront/package.json，产物输出到 ../dist。
      - name: Build Tauri app
        working-directory: ${{ env.TAURI_DIR }}
        run: tauri build

      # 无论哪种触发都上传安装包，方便直接从 Actions 页面下载
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EffiSuite-windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            ${{ env.TAURI_DIR }}/target/release/bundle/nsis/*.exe
            ${{ env.TAURI_DIR }}/target/release/bundle/msi/*.msi

      # 打 tag 时创建 Release 草稿（draft=true，确认无误后手动发布）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EffiSuite ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ env.TAURI_DIR }}/target/release/bundle/nsis/*.exe
            ${{ env.TAURI_DIR }}/target/release/bundle/msi/*.msi
