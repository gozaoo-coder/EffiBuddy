[package]
name = "desktop-suite-core"
version = { workspace = true }
edition = { workspace = true }
description = "Desktop Suite Core (Tauri shell + plugin runtime)"

[lib]
name = "desktop_suite_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
plugin-sdk-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libloading = "0.8"
thiserror = "1"
anyhow = "1"
parking_lot = "0.12"
chrono = "0.4"
sysinfo = "0.30"
log = "0.4"
env_logger = "0.11"
window-vibrancy = "0.5"
reqwest = { version = "0.12", features = ["blocking", "json"], default-features = false }
flate2 = "1"
tar = "0.4"
zip = "0.6"
dirs = "5"
sha2 = "0.10"
hex = "0.4"
