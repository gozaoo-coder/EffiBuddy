[workspace]
resolver = "2"
members = [
    "modules/core",
    "modules/agent",
    "modules/p2pConnection",
    "modules/tauriFront/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["EffiSuite"]
license = "MIT"
repository = "https://github.com/EffiSuite/EffiSuite"

# 统一管理共享依赖版本，各子 crate 通过 `dep.workspace = true` 引用
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

# HTTP / 压缩：ClawHub 客户端使用 reqwest + zip
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# 内部 crate 互引
effisuite-core = { path = "modules/core", version = "0.1.0" }
effisuite-agent = { path = "modules/agent", version = "0.1.0" }
effisuite-p2p = { path = "modules/p2pConnection", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
