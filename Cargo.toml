[workspace]
resolver = "2"
members = [
    "modules/core",
    "modules/agent",
    "modules/p2pConnection",
    "modules/tauriFront/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
authors = ["EffiSuite"]
license = "MIT"
repository = "https://github.com/EffiSuite/EffiSuite"

# 统一管理共享依赖版本，各子 crate 通过 `dep.workspace = true` 引用
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

# 真实 token 计数：压缩节省量 / 上下文占用统计（cl100k_base BPE，离线可用）
tiktoken-rs = "0.6"
# HTTP / 压缩：ClawHub 客户端使用 reqwest + zip
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# ASR：火山引擎流式 WebSocket（tokio-tungstenite）+ gzip 帧压缩（flate2）+ base64 音频编码
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
flate2 = "1"
base64 = "0.22"

# P2P 加密与传输：X25519 ECDH 密钥协商 + Ed25519 配对签名 + AES-256-GCM 动态会话密钥 +
# HKDF 派生 + SHA-256 + 安全随机数；bytes/tokio-util 用于长度前缀帧编解码
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }

# 应用数据目录解析
dirs = "5"

# 内部 crate 互引
effisuite-core = { path = "modules/core", version = "0.1.0" }
effisuite-agent = { path = "modules/agent", version = "0.1.0" }
effisuite-p2p = { path = "modules/p2pConnection", version = "0.1.0" }

[profile.release]
# 体积优先：opt-level="z" 针对二进制体积优化（本应用为 LLM/IO 密集型，本地代码对 CPU 不敏感）
opt-level = "z"
# fat LTO：全程序跨 crate 优化，裁掉 windows/tauri/rig 等依赖中未用代码，显著减小最终 exe
lto = "fat"
codegen-units = 1
strip = true
# 无 std::panic::catch_unwind / panic hook 依赖；abort 移除 unwinding 表，减小二进制
panic = "abort"

# 用本地副本替换 crates.io 的 rig-core（详见 vendor/rig-core/PATCH.md）
[patch.crates-io]
rig-core = { path = "vendor/rig-core" }
