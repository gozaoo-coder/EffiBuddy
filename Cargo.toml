[workspace]
resolver = "2"
members = [
  "apps/core/src-tauri",
  "sdk/plugin-sdk-rs",
  "packages/clock-widget/backend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
plugin-sdk-rs = { path = "sdk/plugin-sdk-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
