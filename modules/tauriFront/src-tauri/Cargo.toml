[package]
name = "effisuite-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "EffiSuite Tauri 应用入口：连接 agent / p2p / core 并暴露给前端"

[lib]
name = "effisuite_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "effisuite-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
effisuite-core.workspace = true
effisuite-agent.workspace = true
effisuite-p2p.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
futures = "0.3"
dirs = "5"
cron = "0.12"
chrono.workspace = true
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
# read_attachment 命令把图片编码为 base64 data URL 供前端渲染
base64 = "0.22"
# list_remote_models / get_remote_model 命令调用 OpenAI 兼容 /v1/models
reqwest.workspace = true
