[package]
name = "effisuite-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "EffiSuite agent 模块：基于 rig 的 LLM 对话能力、流式输出与工具集成"

[dependencies]
effisuite-core.workspace = true
rig-core = "0.40"
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# 在 workspace tokio features 基础上补充 process（用于 ShellTool 的 Command）
tokio = { workspace = true, features = ["process"] }
thiserror.workspace = true
tracing.workspace = true
futures = "0.3"
async-stream = "0.3"
chrono.workspace = true
# ScheduleTool 计算 cron 下次执行时刻（与 tauriFront scheduler.rs 同版本）
cron = "0.12"
# WebFetchTool / ImageGenTool 使用 reqwest；rustls-tls 避免依赖 OpenSSL，json 供 .json()/.bearer_auth()
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# ImageGenTool 生成图片文件名前缀与 base64 解码
uuid.workspace = true
base64 = "0.22"
# GrepTool 正则表达式匹配
regex = "1"
